
# SRCNN Training Configuration

experiment:
  name: srcnn_div2k_super_resolution_5_epochs
  seed: 42

model:
  input_channels: 3
  output_channels: 3
  feature_channels: 64
  mapping_channels: 32

data:
  train_hr_directory: data/DIV2K/train/HR
  train_lr_directory: data/DIV2K/train/LR
  validation_hr_directory: data/DIV2K/validation/HR
  validation_lr_directory: data/DIV2K/validation/LR
  scale_factor: 4
  input_crop: 6
  patch_size: 128
  patches_per_image: 4

training:
  epochs: 5
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0
  num_workers: 0

optimizer:
  name: Adam

loss:
  name: MSELoss

checkpoint:
  directory: checkpoints/srcnn_5_epochs
  save_best_only: true

device:
  use_cuda: false
